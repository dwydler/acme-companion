name: Linting

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.sh"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "**/*.sh"
      - ".github/workflows/lint.yml"

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run ShellCheck
        run: |
          shopt -s globstar
          shellcheck **/*.sh
